function candidates(m){const t=trackOf(m),file=norm(t.file||project.musicAudioFile),folder=norm(project.musicFolder||'../music');if(!file)return [];if(/^https?:\/\//i.test(file))return [file];return [...new Set([folder+'/'+file,'../music/'+file,'music/'+file,'../'+file,file])].map(x=>encodeURI(x));}
function srcFor(m){let arr=candidates(m),index=0;if(!arr.length)return;audio.onerror=()=>{index++;if(index<arr.length){audio.src=arr[index];audio.load();}else{const el=get('ostCueStatus');if(el)el.textContent='Chưa tìm thấy file nhạc. Chọn MP3 bên dưới hoặc kiểm tra đường dẫn GitHub.';}};audio.src=arr[0];audio.load();}
window.ostCuePlay=function(i){const b=(project.blocks||project.items||[])[i],m=b&&b.music;if(!m)return;const id=clean(m.trackId||'default');if(activeId!==id){activeId=id;if(!localUrl)srcFor(m);}const host=get('ostCueAudioHost');if(host)host.appendChild(audio);stopAt=Number(m.end);const start=Number(m.start)||0;const run=()=>{try{audio.currentTime=start}catch(e){}audio.play().catch(()=>{const el=get('ostCueStatus');if(el)el.textContent='Không phát được nhạc. Hãy chọn file MP3 hoặc kiểm tra đường dẫn.';});};if(audio.readyState>=1)run();else audio.addEventListener('loadedmetadata',run,{once:true});};
audio.addEventListener('timeupdate',()=>{if(stopAt!=null&&audio.currentTime>=stopAt){audio.pause();stopAt=null;}});
window.ostCueLoadFile=function(input){const f=input.files&&input.files[0];if(!f)return;if(localUrl)URL.revokeObjectURL(localUrl);localUrl=URL.createObjectURL(f);audio.onerror=null;audio.src=localUrl;audio.load();const el=get('ostCueStatus');if(el)el.textContent='Đã chọn '+f.name;};
function cueMusic(b){if(!b)return null;return b.music||(project.musicCueData||{})[b.uid]||(project.musicCueData||{})[b.sourceUid]||null;}
function cueBox(m,i){const t=trackOf(m),title=m.title||t.title||'OST',start=Number(m.start)||0,end=Number(m.end)||0;let lines=['ko','vi','en'].filter(k=>clean(m[k]).trim()).map(k=>'<div class="ostCueLyrics"><b>'+({ko:'🇰🇷 KO',vi:'🇻🇳 VI',en:'🇬🇧 EN'}[k])+'</b>'+escapeHtml(m[k])+'</div>').join('');return '<div class="ostCueBox" onclick="event.stopPropagation()"><div class="ostCueHead">🎵 OST · '+escapeHtml(title)+'</div><div class="ostCueMeta">'+start.toFixed(3)+'s → '+end.toFixed(3)+'s</div><button class="ostCueBtn" onclick="ostCuePlay('+i+')">▶ Play OST</button><details><summary>📜 Xem lời bài hát'+(lines?'':' (chưa có Lyrics)')+'</summary>'+lines+'</details></div>';}
const orig=render;
render=function(){const result=orig.apply(this,arguments);const arr=project.blocks||project.items||[];const list=get('list');if(list){const selector=Array.isArray(project.blocks)?'.seg':'.cue';const nodes=list.querySelectorAll(selector);nodes.forEach(node=>{const match=node.getAttribute('onclick')||'',found=match.match(/cur\s*=\s*(\d+)/);let i=found?Number(found[1]):null;if(i===null&&node.id&&/^cue-\d+$/.test(node.id))i=Number(node.id.slice(4));if(i===null)return;const m=cueMusic(arr[i]);if(m){const box=document.createElement('div');box.innerHTML=cueBox(m,i);node.appendChild(box.firstElementChild);}});}return result;};
const top=get('settingsPanel')||get('settings')||document.querySelector('.top')||document.body;const bar=document.createElement('div');bar.style.cssText='background:#faf5ff;border:1px solid #ddd6fe;border-radius:12px;padding:8px;margin:6px 0';bar.innerHTML='<b>🎵 OST Player</b> <span id="ostCueStatus" class="ostCueStatus">Chọn Play OST tại cue có nhạc</span><div id="ostCueAudioHost"></div><label style="display:flex;gap:8px;align-items:center;font-size:12px;margin:7px 0">OST Vol <input id="ostCueVolume" type="range" min="0" max="100" value="70" style="flex:1;min-width:80px"><span id="ostCueVolumeText">70%</span></label><label style="display:block;font-size:12px">Nếu GitHub chưa có nhạc: <input class="ostCueFile" type="file" accept="audio/*" onchange="ostCueLoadFile(this)"></label>';top.appendChild(bar);get('ostCueAudioHost').appendChild(audio);audio.volume=.7;get('ostCueVolume').addEventListener('input',function(){audio.volume=Number(this.value)/100;get('ostCueVolumeText').textContent=this.value+'%';});render();
})();</script></body></html>
