1,"end":43.798277,"viStart":0,"viEnd":10.540563,"koStart":31.570431,"koEnd":43.798277,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":0,"end":10.540563},"koRange":{"start":31.570431,"end":43.798277}},{"id":11,"sourceUid":"merged-mw4zymcm-3011","sourceNo":11,"originalSourceNo":13,"displayNo":11,"vi":"Tôi sẽ cho họ gãi lưng tôi\nđể xem ai thuộc phe tôi, và ai sẽ phải ra đi.","ko":"등 한번 긁어 보게 하면 알겠지\n누가 내 편인지 누가 빠이빠이인지","en":"I'll let them scratch my back\nto see who will be on my side and who will be out.","start":43.798277,"end":50.398547,"viStart":10.540563,"viEnd":17.293061,"koStart":43.798277,"koEnd":50.398547,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":10.540563,"end":17.293061},"koRange":{"start":43.798277,"end":50.398547}},{"id":12,"sourceUid":"merged-mw536wwy-3090","sourceNo":12,"originalSourceNo":16,"displayNo":12,"vi":"Lẽ nào… cô định hợp tác với người chiến thắng?\nTất nhiên rồi. Đâu thể làm tài phiệt nếu đứng cạnh kẻ thất bại.","ko":"박영우: 혹시 이긴 사람과 손을 잡으시겠다는… 당연하지 \n강한나: 패배자 옆에 서 있었으면 재벌 될 수 있겠어?","en":"Are you saying… you'll join forces with the winner?\nOf course. You can't stay a chaebol if you stand with the loser.","start":50.398547,"end":60.008765,"viStart":17.293061,"viEnd":26.612971,"koStart":50.398547,"koEnd":60.008765,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":17.293061,"end":26.612971},"koRange":{"start":50.398547,"end":60.008765}},{"id":13,"sourceUid":"merged-mw503eth-3015","sourceNo":13,"originalSourceNo":18,"displayNo":13,"vi":"Chắc chắn cô ta không hẹn gặp để chúc may mắn.\nCô ta đang muốn hưởng lợi vì bên đó là thông gia tương lai sao?","ko":"고아인: 격려차 만나자고 하는 건 아닐 텐데\n최창수: 예비 사돈댁 일이라고 숟가락 얹으려는 건가?","en":"I'm sure she isn't meeting us to wish us good luck.\nIs she trying to ride coattails since they're her future in-laws?","start":60.008765,"end":68.243746,"viStart":26.612971,"viEnd":35.091338,"koStart":60.008765,"koEnd":68.243746,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":26.612971,"end":35.091338},"koRange":{"start":60.008765,"end":68.243746}},{"id":14,"sourceUid":"merged-mw504bev-3016","sourceNo":14,"originalSourceNo":20,"displayNo":14,"vi":"Cũng phải, Kang Han Na\ncũng phải chứng tỏ bản thân với chủ tịch mà.","ko":"최창수: 하긴 뭐, 강한나도 회장님한테 성과를 보여 줘야겠지","en":"After all, Kang Han-na\nhas to prove herself to the chairman.","start":70.035341,"end":74.920356,"viStart":35.091338,"viEnd":41.880292,"koStart":70.035341,"koEnd":74.920356,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":35.091338,"end":41.880292},"koRange":{"start":70.035341,"end":74.920356}},{"id":15,"sourceUid":"merged-mw508kay-3019","sourceNo":15,"originalSourceNo":24,"displayNo":15,"vi":"[cười]\n[Âm nhạc thú vị]","ko":"[피식 웃는다]\n[흥미로운 음악]","en":"[laughter]\n[Interesting music]","start":91.46,"end":107.85,"viStart":91.46,"viEnd":107.85,"koStart":91.46,"koEnd":107.85,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":16,"sourceUid":"merged-mw506g2i-3017","sourceNo":16,"originalSourceNo":26,"displayNo":16,"vi":"Trước sau vẫn như một thôi. Phe thắng chính là phe mình.\nChẳng thà biết trước mà xử lý còn hơn không biết gì và lo sợ.","ko":"강한나: 우리는 언제나 똑같아 이기는 편 우리 편\n고아인: 모르는 채 불안에 떠는 거보단 먼저 알고 수습하는 게 낫겠지?","en":"We always play by the same rule. The winner is on my team.\nRather than biting my nails and doing nothing, it's better to face it head-on.","start":74.920356,"end":91.592189,"viStart":41.880292,"viEnd":57.452174,"koStart":74.920356,"koEnd":91.592189,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":41.880292,"end":57.452174},"koRange":{"start":74.920356,"end":91.592189}},{"id":17,"sourceUid":"merged-mw508cuj-3018","sourceNo":17,"originalSourceNo":28,"displayNo":17,"vi":"Anh tài xế, lái nhanh hết cỡ giúp tôi.\nVâng.","ko":"고아인: 기사님 최대한 빨리 가 주세요\n[택시 기사] 네","en":"Sir, please drive as fast as possible.\nSure.","start":91.592189,"end":95.306857,"viStart":57.452174,"viEnd":62.189045,"koStart":91.592189,"koEnd":95.306857,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":57.452174,"end":62.189045},"koRange":{"start":91.592189,"end":95.306857}},{"id":19,"sourceUid":"merged-mw50a1s3-3022","sourceNo":19,"originalSourceNo":30,"displayNo":19,"vi":"[Thở gấp]\n[Hết cơn ho]","ko":"[거친 숨소리]\n[헛기침]","en":"[Rough breathing]\n[Clears cough]","start":127.71,"end":131.71,"viStart":127.71,"viEnd":131.71,"koStart":127.71,"koEnd":131.71,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":21,"sourceUid":"merged-mw50c5td-3027","sourceNo":21,"originalSourceNo":36,"displayNo":21,"vi":"Mời vào.\nCuộc họp sao rồi?\nCô không về cùng Giám đốc Choi à?\nTôi đi riêng để anh ấy được thoải mái.\nRa là vậy sao?","ko":"강한나: 어서 오세요\n강한나: 회의는 잘하셨어요?\n박영우: 최 상무님이랑 같이 안 오셨나 보네요?\n고아인: 편하게 오시라고 따로 왔습니다\n강한나: 아, 그러셨어요?","en":"Welcome.\nHow was the meeting?\nYou didn't carpool with Mr. Choi?\nI didn't want him to be uncomfortable.\nI see.","start":113.076826,"end":128.321207,"viStart":80.580708,"viEnd":93.760935,"koStart":113.076826,"koEnd":128.321207,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":80.580708,"end":93.760935},"koRange":{"start":113.076826,"end":128.321207}},{"id":22,"sourceUid":"merged-mw50daa8-3030","sourceNo":22,"originalSourceNo":40,"displayNo":22,"vi":"[Tiếng đóng cửa]\n[Âm nhạc ý nghĩa]","ko":"[문 닫히는 소리]\n[의미심장한 음악]","en":"[Sound of door closing]\n[Meaningful music]","start":135.59,"end":163.03,"viStart":135.59,"viEnd":163.03,"koStart":135.59,"koEnd":163.03,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":23,"sourceUid":"merged-mw50d4vz-3029","sourceNo":23,"originalSourceNo":39,"displayNo":23,"vi":"Cô có gì muốn nói thì nói luôn đi.\nLịch trình của tôi dày quá.\nĐợi Giám đốc Choi đến rồi ta bàn.","ko":"고아인: 하실 말씀 있으시면 빨리하시죠\n고아인: 워낙 스케줄이 촉박해서\n최창수: 최 상무님 오시면 같이 하시죠","en":"Could you tell me what this is about?\nI'm in a rush.\nWe'll talk when Mr. Choi comes.","start":129.2002,"end":136.444125,"viStart":93.760935,"viEnd":103.647379,"koStart":129.2002,"koEnd":136.444125,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":93.760935,"end":103.647379},"koRange":{"start":129.2002,"end":136.444125}},{"id":24,"sourceUid":"merged-mw513rky-3042","sourceNo":24,"originalSourceNo":48,"displayNo":24,"vi":"Tôi cũng có chuyện muốn bàn với cô về lần đấu thầu này.\nBàn với tôi?\nThật vinh dự quá.\nGói thầu này có sức nặng hơn bình thường mà.\nĐúng vậy.\nNếu lần này không suôn sẻ thì cô bị bôi tro trét trấu lên mặt mất.","ko":"고아인: 저도 이번 PT 관련해서 상무님께 상의드릴 게 있었는데\n강한나: 상의요? 저랑?\n강한나: 오… 영광인데요?\n고아인: 이번 PT, 보통의 PT랑은 무게감이 다르잖아요?\n강한나: 그렇죠\n고아인: 이번 거 잘못되면 한나 상무님 얼굴에 똥물 뿌리는 건데","en":"I had a matter to discuss with you on this presentation.\nDiscuss with me?\nWhat an honor.\nThis presentation is on another level.\nRight.\nIf this one goes wrong, it'll be like you getting sabotaged.","start":141.530656,"end":161.125214,"viStart":107.94098,"viEnd":128.141028,"koStart":141.530656,"koEnd":161.125214,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":107.94098,"end":128.141028},"koRange":{"start":141.530656,"end":161.125214}},{"id":25,"sourceUid":"merged-mw50kh8v-3035","sourceNo":25,"originalSourceNo":52,"displayNo":25,"vi":"Ở buổi phỏng vấn về ngày đầu đi làm mà tôi nỗ lực chuẩn bị,\ntrước mặt bao phóng viên khác,\nanh ta đã lên kế hoạch và cố ý bôi tro trét trấu lên mặt tôi!","ko":"강한나: 내 첫 출근 홍보한다고 열심히 준비해서\n강한수: 기자들 모아서 인터뷰하는데\n강한나: 거기다 대고 의도적이고 계획적으로 똥물을 뿌리고!","en":"I went on for an interview about my first day at work\nwith all the reporters in the office.\nBut you intentionally sabotaged my interview!","start":163.752729,"end":172.495863,"viStart":130.240892,"viEnd":139.42065,"koStart":163.752729,"koEnd":172.495863,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":130.240892,"end":139.42065},"koRange":{"start":163.752729,"end":172.495863}},{"id":26,"sourceUid":"merged-mw50nt14-3039","sourceNo":26,"originalSourceNo":57,"displayNo":26,"vi":"[âm nhạc hồi hộp]\n[Tiếng gõ cửa] [Cười]","ko":"[긴장되는 음악]\n[노크 소리] [피식 웃는다]","en":"[nervous music]\n[Knocking sound] [Laughing]","start":185.76,"end":218.25,"viStart":185.76,"viEnd":218.25,"koStart":185.76,"koEnd":218.25,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":28,"sourceUid":"merged-mw50n22v-3038","sourceNo":28,"originalSourceNo":55,"displayNo":28,"vi":"Dĩ nhiên rồi, nhưng đâu chỉ có vậy.\nNếu lần này thất bại, chẳng phải chị cũng khó mà trụ lại công ty sao?\nHãy tận tình giúp đỡ tôi nhé.","ko":"강한나: 그럼요 똥물뿐이겠어요?\n강한나: 이번 거 잘못되면 회사 계속 다니기 어렵지 않겠어요?\n강한나: 많이 도와주세요","en":"Of course, but that won't be all.\nWon't it be difficult for you to keep working here if you fail on this?\nI really do hope you help me out.","start":179.363034,"end":192.839315,"viStart":145.968689,"viEnd":159.990639,"koStart":179.363034,"koEnd":192.839315,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":145.968689,"end":159.990639},"koRange":{"start":179.363034,"end":192.839315}},{"id":29,"sourceUid":"merged-mw51c0np-3044","sourceNo":29,"originalSourceNo":56,"displayNo":29,"vi":"Được rồi. Mọi người đều bận rộn nên tôi sẽ vào vấn đề luôn.\nVề gói thầu của Woowon lần này, hai phòng dự án và sáng tạo\nsẽ thực hiện riêng.\nPhòng nào làm phòng đó.\nChuyện này…","ko":"강한나: 자, 다들 바쁘신 분들이니까 본론부터 말할까요?\n강한나: 이번 우원그룹 PT는 기획이랑 제작 나눠서 진행합니다\n강한나: 각각 따로","en":"All right. Since you're both busy, I'll get to the point.\nThis Woowon Presentation will be prepared by both project and creative teams\nseparately.\nTwo separate teams, individually.\nWell…","start":202.848476,"end":224.186046,"viStart":169.149369,"viEnd":187.318258,"koStart":202.848476,"koEnd":224.186046,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":169.149369,"end":187.318258},"koRange":{"start":202.848476,"end":224.186046}},{"id":30,"sourceUid":"merged-mw50pa3w-3041","sourceNo":30,"originalSourceNo":62,"displayNo":30,"vi":"[âm nhạc hồi hộp]\n[Giọng xấu hổ của Changsu]","ko":"[긴장되는 음악]\n[창수의 당황한 소리]","en":"[nervous music]\n[Changsu’s embarrassed voice]","start":187.318258,"end":193.558621,"viStart":187.318258,"viEnd":193.558621,"koStart":187.318258,"koEnd":193.558621,"hasViAudio":true,"hasKoAudio":false,"viRange":{"start":187.318258,"end":193.558621},"koRange":null},{"id":31,"sourceUid":"merged-mw51fmfr-3045","sourceNo":31,"originalSourceNo":65,"displayNo":31,"vi":"Đội phó Han, lần này ta sẽ làm với đội nào?\nChắc là với đội của anh Jung.\nĐúng rồi, đội đó chuyên về truyền thông doanh nghiệp mà.","ko":"조은정: 부장님, 이번 PT 기획은 어느 팀이랑 해요?\n한병수: 아마 정 국장님 팀이랑 하지 않을까?\n배원희: 그렇죠 그 팀이 기업 PR 전문이니까","en":"Mr. Han, which team is planning this presentation?\nProbably with Mr. Jung's team.\nRight, his team is an expert on corporate PR.","start":230.224595,"end":238.147,"viStart":196.74692,"viEnd":205.283156,"koStart":230.224595,"koEnd":238.147,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":196.74692,"end":205.283156},"koRange":{"start":230.224595,"end":238.147}},{"id":32,"sourceUid":"merged-mw51j215-3050","sourceNo":32,"originalSourceNo":71,"displayNo":32,"vi":"Phân tích xong thị hiếu của Woowon chưa?\nVâng, đây ạ.\nTừ khóa từ phân tích dữ liệu thì sao?\nTôi gửi rồi ạ.\nNghe mà vững cái tâm, chắc cái dạ ghê.","ko":"한병수: 우원 광고주 성향 파악한 자료 준비됐어?\n서장우: 네, 다 됐습니다\n한병수: 포털사 데이터랩에서 모은 키워드는?\n배원희: 보냈습니다\n조은정: 오, 뭔가 안심, 등심, 살치 하네요","en":"Do you have the analysis on Woowon's preferences?\nYes, here you go.\nAnd the keywords from the data lab?\nI sent it.\nI'm glad that we're working with them. That's such a relief.","start":238.848006,"end":249.915855,"viStart":205.283156,"viEnd":216.228653,"koStart":238.848006,"koEnd":249.915855,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":205.283156,"end":216.228653},"koRange":{"start":238.848006,"end":249.915855}},{"id":33,"sourceUid":"ko-mw4xnc3r-66","sourceNo":33,"originalSourceNo":66,"displayNo":33,"vi":"[Âm nhạc sôi động] [Giám đốc Jeong][Nhân viên 1][Nhân viên 2] [Tiếng cười của Byungsu]","ko":"[흥미진진한 음악] [정 국장][직원1][직원2] [병수의 웃음]","en":"[Exciting music] [Director Jeong][Employee 1][Employee 2] [Byungsu’s laughter]","start":261.05,"end":262.13,"viStart":261.05,"viEnd":262.13,"koStart":261.05,"koEnd":262.13,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":34,"sourceUid":"merged-mw51mlp3-3054","sourceNo":34,"originalSourceNo":75,"displayNo":34,"vi":"Nghĩ thôi đã thấy đáng tin cậy.\nĐúng vậy nhỉ?\nNếu chỉ có mỗi chúng ta thì chắc lộn tùng phèo rồi.\nTôi phấn khích quá.\nHồi ở công ty trước, tôi suốt ngày chỉ làm mấy dự án nhỏ.","ko":"조은정: 생각만 해도 든든해\n배원희: 그렇죠? 제작 팀만으론 우둔살인데\n조은정: 오, 나 흥분된다\n조은정: 아니, 나 이전 회사에서는 맨날 자잘한 것만 해 가지고","en":"They are so reliable.\nI know, right?\nWe would have been in trouble just by ourselves.\nI'm so excited.\nI only worked on small projects at my previous agency.","start":249.915855,"end":264.025879,"viStart":216.228653,"viEnd":230.732975,"koStart":249.915855,"koEnd":264.025879,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":216.228653,"end":230.732975},"koRange":{"start":249.915855,"end":264.025879}},{"id":35,"sourceUid":"merged-mw51o3et-3056","sourceNo":35,"originalSourceNo":79,"displayNo":35,"vi":"Cứ mong được một lần làm dự án lớn.\nCuối cùng cũng được đấu thầu truyền thông doanh nghiệp trị giá 30 tỷ!\nVậy cô chuyển việc qua đây để làm dự án lớn sao?","ko":"조은정: 언제 큰 거 하나 했는데\n조은정: 드디어 빌링 300억의 기업 PR PT를 하는구나! [웃음]\n배원희: 큰 건 하고 싶으셔서 고 상무님 팀으로 이직하신 거예요?","en":"But I wanted to handle a big project.\nBut finally, a corporate PR presentation with a billing of 30 billion won!\nSo you got a job here under Ms. Go to work on big projects?","start":264.025879,"end":274.069976,"viStart":230.732975,"viEnd":240.633383,"koStart":264.025879,"koEnd":274.069976,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":230.732975,"end":240.633383},"koRange":{"start":264.025879,"end":274.069976}},{"id":36,"sourceUid":"merged-mw525c72-3060","sourceNo":36,"originalSourceNo":86,"displayNo":36,"vi":"Dĩ nhiên rồi.\nVất vả tỷ lệ thuận với độ đẹp của hồ sơ mà.\nNhưng 30 tỷ là sao?\nKhông phải à?\nLà 300 tỷ won.\nNếu giành được vụ này, quảng cáo của Woowon sẽ về tay ta hết.","ko":"조은정: 아유, 그럼요 고생과 포트폴리오는 정비례하니까\n서장우: 근데 무슨 300억이에요?\n조은정: 300억 아니야?\n한병수: 3,000억 이번 기업 PR 가져오면\n한병수: 우원그룹 물량 전부 가져오는 거니까","en":"Of course.\nAlthough it's hard work, my portfolio would look amazing.\nWhat do you mean 30 billion?\nIs it not?\nIt's 300 billion won.\nIf they choose us, we'll be getting all of Woowon's ads.","start":274.069976,"end":286.631664,"viStart":240.633383,"viEnd":253.403686,"koStart":274.069976,"koEnd":286.631664,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":240.633383,"end":253.403686},"koRange":{"start":274.069976,"end":286.631664}},{"id":37,"sourceUid":"merged-mw526kg4-3062","sourceNo":37,"originalSourceNo":87,"displayNo":37,"vi":"Ba trăm tỷ sao?\nBên dự án phải mau định phương hướng để ta còn bắt đầu.\nVậy hay là chúng ta thảo luận với bên đó trước?","ko":"조은정: 3,000억이요?\n서장우: 기획 쪽에서 빨리 방향을 정해 줘야\n서장우: 제작도 스타트하는데\n조은정: 그러면 우리가 먼저 기획 쪽이랑 회의하는 건 어때요?","en":"Three hundred billion won?\nThe project team has to give us a direction so that we can begin.\nThen why don't we discuss it with them first?","start":286.631664,"end":298.950114,"viStart":253.403686,"viEnd":265.646296,"koStart":286.631664,"koEnd":298.950114,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":253.403686,"end":265.646296},"koRange":{"start":286.631664,"end":298.950114}},{"id":38,"sourceUid":"merged-mw528mhw-3067","sourceNo":38,"originalSourceNo":94,"displayNo":38,"vi":"Không được. Tuyệt đối không được.\nTại sao?\nSeo Jeong và tôi vốn là bạn thân.\nTập đoàn Woowon cũng sắp là thông gia nhà tôi.\nChẳng phải công ty nên dồn toàn lực vào dự án lần này sao?\nVậy nên tôi càng phản đối.","ko":"박영우: 그건 안 되죠 안 됩니다, 절대\n강한나: 왜요? 서정이가 나랑 워낙 베프고\n강한나: 우원그룹은 예비 사돈이니까\n강한나: 이번 건은 회사가 총력을 다해야지 않겠어요?\n박영우: 그러니까 더욱 안 된다는 겁니다","en":"No. That can't happen.\nWhy not?\nSeo-jeong and I are best friends.\nAnd the Woowon Group people are my future in-laws.\nSo don't you think we should invest everything into it?\nThat's why I'm against this.","start":298.950114,"end":312.523,"viStart":265.646296,"viEnd":279.218373,"koStart":298.950114,"koEnd":312.523,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":265.646296,"end":279.218373},"koRange":{"start":298.950114,"end":312.523}},{"id":39,"sourceUid":"merged-mw52cenh-3070","sourceNo":39,"originalSourceNo":100,"displayNo":39,"vi":"Một quảng cáo được tạo ra nhờ vào sự hợp tác của dự án và sáng tạo.\nNếu cô chặt bỏ một cánh thì sao máy bay có thể bay lên được?\nTên lửa không có cánh vẫn bay lên được đấy thôi.","ko":"최창수: 광고라는 게 기획이랑 제작 두 파트가 협의하면서 하는 건데\n최창수: 날개 하나 떼어 내면 비행기가 어떻게 날아오르겠습니까?\n고아인: 로케트는 날개 없이도 잘만 날아오르잖아요?","en":"An ad is created through the cooperation of planning and creative work.\nIf you remove a wing from a plane, it won't be able to fly.\nBut a rocket flies just fine without wings.","start":312.523,"end":326.178535,"viStart":279.218373,"viEnd":292.767217,"koStart":312.523,"koEnd":326.178535,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":279.218373,"end":292.767217},"koRange":{"start":312.523,"end":326.178535}},{"id":40,"sourceUid":"merged-mw52cn0s-3071","sourceNo":40,"originalSourceNo":102,"displayNo":40,"vi":"[Changsu hắng giọng]\n[Âm nhạc ý nghĩa]","ko":"[창수의 헛기침]\n[의미심장한 음악]","en":"[Changsu clears his throat]\n[Meaningful music]","start":350.64,"end":354.56,"viStart":350.64,"viEnd":354.56,"koStart":350.64,"koEnd":354.56,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":41,"sourceUid":"merged-mw52fe4j-3075","sourceNo":41,"originalSourceNo":108,"displayNo":41,"vi":"Trợ lý Park thản nhiên như vậy,\nxem ra đây không phải quyết định bồng bột, mà là kế hoạch tỉ mỉ.\nViệc dự án và sáng tạo làm việc riêng biệt là chưa từng có tiền lệ.\nBên Woowon đồng ý chứ?\nVâng, họ đã đồng ý.","ko":"고아인: 박 차장이 당황하지 않는 거 보면\n고아인: 사고가 아니라 계획이라는 건데\n최창수: 기획 따로 제작 따로 PT에 들어가는 건\n최창수: 이 업계 상식으로도…\n고아인: 우원 쪽이랑 협의된 겁니까?\n박영우: 네, 협의됐습니다","en":"Looking at how composed Mr. Park is,\nthis isn't a rash decision, but a carefully made plan.\nBoth departments working separately? That's unprecedented in this field.\nDoes the client know about this?\nYes, they agreed to it.","start":326.178535,"end":347.245433,"viStart":296.014435,"viEnd":314.5547,"koStart":326.178535,"koEnd":347.245433,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":296.014435,"end":314.5547},"koRange":{"start":326.178535,"end":347.245433}},{"id":42,"sourceUid":"merged-mw52h0qd-3077","sourceNo":42,"originalSourceNo":113,"displayNo":42,"vi":"Sao chưa bàn bạc gì với chúng tôi mà đã…\nKhi dự án và sáng tạo làm việc riêng,\nthì ta sẽ có hai hướng đi.\nNhư vậy sẽ có nhiều khả năng tạo ra được một quảng cáo hay hơn.\nCàng nhiều càng tốt.","ko":"최창수: 아니, 일을 상의도 없이 그렇게…\n강한나: 기획이랑 제작 둘로 나눠서 하면\n강한나: 두 가지 방향 나올 거고\n강한나: 그럼 더 좋은 광고 나올 가능성이 높잖아요?\n강한나: 다다익선","en":"How could you do this without discussing it with--\nWith your teams working separately,\nwe'll have two ideas.\nThen we'll have a higher chance of creating a better ad.\nThe more, the better.","start":347.245433,"end":361.130533,"viStart":314.5547,"viEnd":331.19397,"koStart":347.245433,"koEnd":361.130533,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":314.5547,"end":331.19397},"koRange":{"start":347.245433,"end":361.130533}},{"id":43,"sourceUid":"merged-mw52ork3-3085","sourceNo":43,"originalSourceNo":114,"displayNo":43,"vi":"Giám đốc Han Na.\nVâng?\nTôi phải rút lại lời tôi nói trước đây rồi.\nLời nào vậy?\n\"Đừng mù mờ không biết gì, rồi làm những việc không ai bảo,\nkẻo gây rắc rối lớn.\"\nĐúng là cô gây rắc rối nhưng không phải không biết gì.\nĐâu nhất thiết phải dùng lược mới rẽ được ngôi.","ko":"고아인: 한나 상무님\n강한나: 네\n고아인: 지난번에 제가 한 말 취소해야겠네요\n강한나: 무슨 말이요?\n고아인: 아무것도 모르면서 시키지도 않은 일 하다가 사고 치지 말라는 말\n고아인: 아무것도 모르시진 않네요 사고는 치시지만\n고아인: 가르마를 꼭 빗으로 탈 필요는 없죠","en":"Ms. Kang.\nYes?\nI'll have to take back what I said last time.\nWhich one?\n\"Don't cause trouble by doing something you don't even know.\"\nAlthough you do cause trouble, you're quite well aware.\nWe don't always have to stick to the norm","start":361.130533,"end":396.084909,"viStart":331.19397,"viEnd":362.976283,"koStart":361.130533,"koEnd":396.084909,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":331.19397,"end":362.976283},"koRange":{"start":361.130533,"end":396.084909}},{"id":44,"sourceUid":"merged-mw52ov09-3086","sourceNo":44,"originalSourceNo":123,"displayNo":44,"vi":"[Hết cơn ho]\n[Âm nhạc thú vị]\n[cười]","ko":"[헛기침]\n[흥미로운 음악]\n[헛웃음]","en":"[Clears cough]\n[Interesting music]\n[laughter]","start":384.67,"end":414.08,"viStart":384.67,"viEnd":414.08,"koStart":384.67,"koEnd":414.08,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":45,"sourceUid":"merged-mw52qybv-3087","sourceNo":45,"originalSourceNo":127,"displayNo":45,"vi":"Vì ta dùng dao cũng được mà.\nRắc rối tầm này thì tôi sẵn lòng đón nhận.\nNhưng…","ko":"고아인: 칼로도 탈 순 있는 거니까\n고아인: 이런 사고라면 저는 환영입니다\n최창수: 아…","en":"when there's an alternative.\nI'm all for trouble like this.\nBut…","start":396.084909,"end":408.803639,"viStart":362.976283,"viEnd":385.247122,"koStart":396.084909,"koEnd":408.803639,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":362.976283,"end":385.247122},"koRange":{"start":396.084909,"end":408.803639}},{"id":46,"sourceUid":"merged-mw52r546-3088","sourceNo":46,"originalSourceNo":129,"displayNo":46,"vi":"[Changsu hắng giọng]\n[Thở dài của Changsu]","ko":"[창수의 헛기침]\n[창수의 한숨]","en":"[Changsu clears his throat]\n[Changsu’s sigh]","start":430.59,"end":434.05,"viStart":430.59,"viEnd":434.05,"koStart":430.59,"koEnd":434.05,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":48,"sourceUid":"merged-mw5oznt5-1","sourceNo":48,"originalSourceNo":131,"displayNo":48,"vi":"Giám đốc Go, thấy con nít xốc nổi thì cô phải cản chứ,\nsao lại hùa theo thế?","ko":"최창수: 고 상무 철부지가 날뛰면 말려야지 같이 방방 뛰면 어떡해?","en":"When an immature kid acts up, you have to stop her,\nrather than dance with her.","start":420.132715,"end":424.619971,"viStart":385.247122,"viEnd":392.027349,"koStart":420.132715,"koEnd":424.619971,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":385.247122,"end":392.027349},"koRange":{"start":420.132715,"end":424.619971}},{"id":49,"sourceUid":"merged-mw5p21wu-3","sourceNo":49,"originalSourceNo":136,"displayNo":49,"vi":"Anh muốn tôi cản con gái chủ tịch kiểu gì?\nCô lo liệu được không?\nKhông có đội dự án, cô có kham nổi không?","ko":"고아인: 대한민국 회사에서 회장 딸을 무슨 수로 막겠어요?\n최창수: 감당되겠어?\n최창수: 기획들 없이 이번 일 가능하겠냐고","en":"How would you ever stop a chairman's daughter?\nCan you handle it?\nCan you do it without my project team?","start":425.377814,"end":447.227643,"viStart":392.027349,"viEnd":414.068849,"koStart":425.377814,"koEnd":447.227643,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":392.027349,"end":414.068849},"koRange":{"start":425.377814,"end":447.227643}},{"id":50,"sourceUid":"merged-mw5p4g3h-4","sourceNo":50,"originalSourceNo":137,"displayNo":50,"vi":"[Thở dài của Changsu]\n[âm nhạc đen tối]","ko":"[창수의 한숨]\n[어두운 음악]","en":"[Changsu’s sigh]\n[dark music]","start":463.79,"end":473.59,"viStart":463.79,"viEnd":473.59,"koStart":463.79,"koEnd":473.59,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":51,"sourceUid":"merged-mw5p5zsh-6","sourceNo":51,"originalSourceNo":127,"displayNo":51,"vi":"Anh sợ à? Chỉ cần duy trì hiện trạng, cái ghế tổng giám đốc sẽ về tay anh.\nNhưng bị bắt cạnh tranh với tôi nên giờ anh thấy xa vời?","ko":"고아인: 쫄리세요? 현상 유지만 하면 대표 자리 본인 건데\n고아인: 나랑 경쟁시키니까 훅 날아갈 거 같죠?","en":"Are you scared? All you needed to do was maintain the status quo to be the CEO.\nBut it feels out of reach since they're pitting you against me.","start":447.227643,"end":457.570024,"viStart":414.068849,"viEnd":425.199956,"koStart":447.227643,"koEnd":457.570024,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":414.068849,"end":425.199956},"koRange":{"start":447.227643,"end":457.570024}},{"id":52,"sourceUid":"merged-mw5pfwyc-8","sourceNo":52,"originalSourceNo":142,"displayNo":52,"vi":"Cứ thế này rồi lỡ như để dự án rơi vào tay công ty function clampVol(v){v=Number(v);if(!Number.isFinite(v))v=100;return Math.max(0,Math.min(200,v))}

function validRange(s,e){s=Number(s);e=Number(e);return Number.isFinite(s)&&Number.isFinite(e)&&e>=s}

function selected(side){const idx=side==='left'?state.leftSel:state.rightSel;if(idx===null||idx===undefined)return null;return side==='left'?state.left[idx]:state.right[idx]}
